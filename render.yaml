services:
  - type: web
    name: helios
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/meta
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: EE_PROJECT
        sync: false
      - key: EE_KEY_JSON
        sync: false

      - key: ANTHROPIC_API_KEY
        sync: false
